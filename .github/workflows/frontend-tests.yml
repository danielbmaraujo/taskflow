name: 🎨 Testes Frontend (UI)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  frontend-tests:
    name: Testes de Interface com Cypress
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Instalar dependências raiz (Cypress)
        run: npm install

      - name: 📦 Instalar dependências do backend
        run: cd backend && npm install

      - name: 🚀 Iniciar servidor backend
        run: |
          cd backend && node server.js &
          echo "Aguardando backend na porta 3001..."
          npx wait-on http://localhost:3001/api/health --timeout 30000

      - name: 🌐 Instalar e iniciar servidor frontend
        run: |
          npm install -g http-server
          http-server frontend -p 8080 &
          echo "Aguardando frontend na porta 8080..."
          npx wait-on http://localhost:8080 --timeout 30000

      - name: 🧪 Executar testes do frontend
        run: npx cypress run --spec "cypress/e2e/frontend.cy.js"

      - name: 📊 Upload de screenshots em caso de falha
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-frontend-screenshots
          path: cypress/screenshots
          retention-days: 7
